# themeing
font_size 15.0
tab_bar_edge top
include current-theme.conf

# new tab with cwd not default dir
map ctrl+shift+t new_tab_with_cwd
# Avoid accidental Codex exits when hitting Ctrl+C instead of Ctrl+Shift+C.
# Use Ctrl+Alt+C when Codex really needs Ctrl+C, such as exiting /side.
map --when-focus-on var:codex_no_ctrl_c ctrl+c discard_event
map --when-focus-on var:codex_no_ctrl_c ctrl+alt+c send_key ctrl+c

filter_notification all

# Allow remote control for tab title updates
allow_remote_control yes
# Per-instance unix socket so `kitty @` doesn't use the TTY (which would
# pollute foreground apps' stdin with response bytes — breaks TUIs).
listen_on unix:/tmp/kitty-{kitty_pid}
