# Hermes refreshes the main gateway unit on process start. Keep work-service
# ownership in a repo-managed drop-in so that self-update cannot move it back
# under default.target or detach it from work.target stop/restart operations.
[Unit]
After=driver-shield-main-demo.service
PartOf=work.target

[Service]
# Shared loopback API bearer used by Hermes and the Driver Shield web proxy.
# Keep this in the drop-in because Hermes refreshes its generated main unit.
EnvironmentFile=/home/howis/.config/driver-shield/hermes.env

[Install]
WantedBy=
WantedBy=work.target
