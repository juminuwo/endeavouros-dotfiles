services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
    volumes:
      - /home/howis/services/calibre-web/config:/config
      - /mnt/Main/ebooks/calibre-library:/books
    ports:
      - "8083:8083"
    restart: unless-stopped
