- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.config/nvim: config/nvim
    ~/.zshrc: config/zshrc
    ~/.config/i3: config/i3
    ~/.xprofile: config/xprofile
    ~/.Xmodmap: config/Xmodmap
    ~/.config/kitty/kitty.conf: config/kitty.conf
    ~/.config/kitty/open-actions.conf: config/open-actions.conf
    ~/.claude/settings.json: config/claude-settings.json
    ~/.claude/keybindings.json: config/claude-keybindings.json
    ~/.claude/skills/research-first: config/claude-skills/research-first
    ~/.claude/skills/tech-wiki: config/claude-skills/tech-wiki
    ~/.claude/skills/update-projects: config/claude-skills/update-projects
    ~/.config/kitty/current-theme.conf: config/kitty-current-theme.conf
    ~/.config/systemd/user/mmo-mouse-workspaces.service: config/systemd/user/mmo-mouse-workspaces.service
    ~/.gitconfig: config/gitconfig
    ~/.config/git/ignore: config/gitignore-global
    ~/.ssh/config:
      path: config/ssh-config
      create: true
    ~/git/CLAUDE.md: config/CLAUDE.md
    ~/bin/clip-img: config/clip-img
    ~/bin/paste-dedented: config/paste-dedented
    ~/bin/claude-notify: config/claude-alerts/claude-notify
    ~/Documents/online-personal/_slides-assets/rose-pine.css: config/slides-themes/rose-pine.css
    ~/.local/bin/restore_i3_session.sh: config/bin/restore_i3_session.sh
    ~/.local/bin/save_i3_session.sh: config/bin/save_i3_session.sh
    ~/.local/bin/soundwire-tray: config/bin/soundwire-tray
    ~/.local/bin/claude-dashboard: config/bin/claude-dashboard
    ~/.local/bin/claude-dashboard-spawn: config/bin/claude-dashboard-spawn
    ~/.config/picom/picom.conf: config/picom.conf
    ~/.config/fcitx5/profile: config/fcitx5/profile
    ~/.config/fcitx5/config: config/fcitx5/config

- shell:
  - [git submodule update --init --recursive, Installing submodules]
