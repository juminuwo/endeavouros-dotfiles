- defaults:
    link:
      relink: true
      create: true

- shell:
  - [config/bin/bootstrap-tech-handbook, Ensuring Imoto Labs tech handbook checkout]
  - [config/bin/install-koreader-config, Seeding portable KOReader settings]

- clean: ['~']

- link:
    ~/.config/nvim: config/nvim
    ~/.config/environment.d/zz-default-apps.conf: config/environment.d/zz-default-apps.conf
    ~/.config/mimeapps.list:
      path: config/mimeapps.list
      force: true
    ~/.config/koreader/defaults.custom.lua:
      path: config/koreader/defaults.custom.lua
      force: true
    ~/.zshrc: config/zshrc
    ~/.config/i3: config/i3
    ~/.config/flameshot/flameshot.ini: config/flameshot/flameshot.ini
    ~/.xprofile: config/xprofile
    ~/.Xmodmap: config/Xmodmap
    ~/.config/kitty/kitty.conf: config/kitty.conf
    ~/.config/kitty/open-actions.conf: config/open-actions.conf
    ~/.config/leaf/config.toml: config/leaf/config.toml
    ~/.config/yazi: config/yazi
    ~/.claude/settings.json: config/claude-settings.json
    ~/.claude/keybindings.json: config/claude-keybindings.json
    ~/.codex/config.toml: config/codex-config.toml
    ~/.codex/hooks.json: config/codex-hooks.json
    ~/.codex/AGENTS.md:
      path: config/AGENTS.md
      relink: true
    # Skills: Codex and legacy Claude Code get per-skill symlinks; Hermes reads the
    # same canonical source dir via skills.external_dirs configured below.
    ~/.claude/skills/research-first: config/agent-skills/research-first
    ~/.claude/skills/tech-wiki: config/agent-skills/tech-wiki
    ~/.claude/skills/update-projects: config/agent-skills/update-projects
    ~/.claude/skills/obsidian-vault: config/agent-skills/obsidian-vault
    ~/.claude/skills/kitty-codex-agents: config/agent-skills/kitty-codex-agents
    ~/.claude/skills/imoto-one-pagers: config/agent-skills/imoto-one-pagers
    ~/.claude/skills/dotfiles-autoupdate: config/agent-skills/dotfiles-autoupdate
    ~/.claude/skills/job-market-tracker: config/agent-skills/job-market-tracker
    ~/.agents/skills/research-first: config/agent-skills/research-first
    ~/.agents/skills/tech-wiki: config/agent-skills/tech-wiki
    ~/.agents/skills/update-projects: config/agent-skills/update-projects
    ~/.agents/skills/obsidian-vault: config/agent-skills/obsidian-vault
    ~/.agents/skills/kitty-codex-agents: config/agent-skills/kitty-codex-agents
    ~/.agents/skills/imoto-one-pagers: config/agent-skills/imoto-one-pagers
    ~/.agents/skills/dotfiles-autoupdate: config/agent-skills/dotfiles-autoupdate
    ~/.agents/skills/job-market-tracker: config/agent-skills/job-market-tracker
    # Agents — legacy Claude reads markdown (.claude/agents/*.md), Codex reads TOML
    # (.codex/agents/*.toml). Formats differ, so we maintain both. The Codex
    # version is generated from the markdown source and must be regenerated
    # when that source changes.
    ~/.claude/agents/kanban-planner.md: config/agent-agents/kanban-planner.md
    ~/.codex/agents/kanban-planner.toml: config/codex-agents/kanban-planner.toml
    ~/.config/kitty/current-theme.conf: config/kitty-current-theme.conf
    ~/.config/systemd/user/mmo-mouse-workspaces.service: config/systemd/user/mmo-mouse-workspaces.service
    ~/.gitconfig: config/gitconfig
    ~/.config/git/ignore: config/gitignore-global
    ~/.ssh/config:
      path: config/ssh-config
      create: true
    ~/git/AGENTS.md: config/AGENTS.md
    ~/git/CLAUDE.md:
      path: config/AGENTS.md
      relink: true
    ~/bin/clip-img: config/clip-img
    ~/bin/claude-notify: config/claude-alerts/claude-notify
    ~/Documents/online-personal/_slides-assets/rose-pine.css: config/slides-themes/rose-pine.css
    ~/.local/bin/restore_i3_session.sh: config/bin/restore_i3_session.sh
    ~/.local/bin/save_i3_session.sh: config/bin/save_i3_session.sh
    ~/.local/bin/soundwire-tray: config/bin/soundwire-tray
    ~/.local/bin/agents-dashboard: config/bin/agents-dashboard
    ~/.local/bin/agents-dashboard-spawn: config/bin/agents-dashboard-spawn
    ~/.local/bin/backup-hermes-restic: config/bin/backup-hermes-restic
    ~/.local/bin/hermes-notify-hook: config/bin/hermes-notify-hook
    ~/.local/bin/dotfiles-autoupdate: config/bin/dotfiles-autoupdate
    ~/.local/bin/project-switch: config/bin/project-switch
    ~/.local/bin/project-status: config/bin/project-status
    ~/.local/bin/services-workflow: config/bin/services-workflow
    ~/.local/bin/repair-japanese-epubs: config/bin/repair-japanese-epubs
    ~/.local/bin/i3blocks-workspaces: config/bin/i3blocks-workspaces
    ~/.local/bin/i3-workspace-watcher: config/bin/i3-workspace-watcher
    ~/.config/picom/picom.conf: config/picom.conf
    ~/.config/fcitx5/profile: config/fcitx5/profile
    ~/.config/fcitx5/config: config/fcitx5/config

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [command -v hermes >/dev/null 2>&1 && hermes config set skills.external_dirs ~/git/endeavouros-dotfiles/config/agent-skills || true, Configuring Hermes skill source]
